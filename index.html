<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#B85C36" />

    <title>Hương Vị Đồng Tháp - Nem chua, nem bì, chả lụa Lai Vung</title>
    <meta
      name="description"
      content="Nem chua, nem bì, chả lụa Lai Vung chính gốc Đồng Tháp - gói lá chuối thủ công mỗi ngày. Đặt online, giao tận nhà toàn quốc, đổi trả miễn phí 30 ngày."
    />

    <!-- Open Graph (Facebook, Zalo, Messenger) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hương Vị Đồng Tháp" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://huong-vi-dong-thap.vercel.app/" />
    <meta property="og:title" content="Hương Vị Đồng Tháp - Đặc sản nem Lai Vung, Đồng Tháp" />
    <meta
      property="og:description"
      content="Nem chua, nem bì, chả lụa Lai Vung gói lá chuối thủ công mỗi ngày. Đặt online, giao tận nhà toàn quốc."
    />
    <meta property="og:image" content="https://huong-vi-dong-thap.vercel.app/og.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Nem chua Lai Vung gói lá chuối" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hương Vị Đồng Tháp - Đặc sản nem Lai Vung" />
    <meta
      name="twitter:description"
      content="Nem chua, nem bì, chả lụa Lai Vung gói lá chuối thủ công. Giao tận nhà toàn quốc."
    />
    <meta name="twitter:image" content="https://huong-vi-dong-thap.vercel.app/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Apply saved theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
